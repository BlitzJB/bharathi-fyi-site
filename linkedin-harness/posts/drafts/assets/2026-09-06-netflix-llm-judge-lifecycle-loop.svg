<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d1c1a"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4432b"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0a66c2"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#faf9f7"/>

  <text x="80" y="78" font-size="36" font-weight="700" fill="#1d1c1a">How Netflix keeps an LLM judge honest</text>
  <text x="80" y="112" font-size="20" fill="#6b6a67">arXiv 2608.18300 &#183; explanation blurbs on the mobile app, tens of millions of members</text>

  <!-- top row: writer -> judge -> member -->
  <rect x="80" y="180" width="250" height="96" rx="12" fill="#ffffff" stroke="#d8d5d0" stroke-width="2"/>
  <text x="205" y="222" font-size="24" font-weight="700" fill="#1d1c1a" text-anchor="middle">Writer LLM</text>
  <text x="205" y="252" font-size="17" fill="#6b6a67" text-anchor="middle">drafts the blurb</text>

  <rect x="475" y="180" width="250" height="96" rx="12" fill="#ffffff" stroke="#0a66c2" stroke-width="2.5"/>
  <text x="600" y="222" font-size="24" font-weight="700" fill="#1d1c1a" text-anchor="middle">Judge LLM</text>
  <text x="600" y="252" font-size="17" fill="#6b6a67" text-anchor="middle">good enough to show?</text>

  <rect x="880" y="180" width="240" height="96" rx="12" fill="#ffffff" stroke="#d8d5d0" stroke-width="2"/>
  <text x="1000" y="222" font-size="24" font-weight="700" fill="#1d1c1a" text-anchor="middle">Member</text>
  <text x="1000" y="252" font-size="17" fill="#6b6a67" text-anchor="middle">sees the blurb</text>

  <line x1="330" y1="228" x2="466" y2="228" stroke="#1d1c1a" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="398" y="212" font-size="16" fill="#6b6a67" text-anchor="middle">blurb</text>

  <line x1="725" y1="228" x2="871" y2="228" stroke="#1d1c1a" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="798" y="212" font-size="16" fill="#6b6a67" text-anchor="middle">pass</text>

  <!-- reject loop -->
  <path d="M 600 276 L 600 370 L 205 370 L 205 285" fill="none" stroke="#c4432b" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="612" y="330" font-size="17" fill="#c4432b">reject + stated reason</text>
  <text x="402" y="398" font-size="17" font-weight="700" fill="#c4432b" text-anchor="middle">the reason becomes the writer&#8217;s revision instruction</text>

  <!-- hazard -->
  <rect x="80" y="420" width="1040" height="74" rx="12" fill="#fbeae5" stroke="#c4432b" stroke-width="2"/>
  <text x="600" y="452" font-size="22" font-weight="700" fill="#c4432b" text-anchor="middle">The hazard: right verdict, wrong reason</text>
  <text x="600" y="480" font-size="18" fill="#7a3527" text-anchor="middle">a judge that rejects correctly but explains incorrectly feeds a bad instruction into every retry</text>

  <!-- oversight row -->
  <rect x="80" y="560" width="500" height="120" rx="12" fill="#eef4fb" stroke="#0a66c2" stroke-width="2"/>
  <text x="330" y="600" font-size="22" font-weight="700" fill="#0a66c2" text-anchor="middle">Meta-judge</text>
  <text x="330" y="630" font-size="18" fill="#1d1c1a" text-anchor="middle">grades the judge&#8217;s reasoning, not its verdicts</text>
  <text x="330" y="658" font-size="18" font-weight="700" fill="#1d1c1a" text-anchor="middle">98.6% agreement with human raters</text>

  <rect x="620" y="560" width="500" height="120" rx="12" fill="#eef4fb" stroke="#0a66c2" stroke-width="2"/>
  <text x="870" y="600" font-size="22" font-weight="700" fill="#0a66c2" text-anchor="middle">Humans, permanently</text>
  <text x="870" y="630" font-size="18" fill="#1d1c1a" text-anchor="middle">~300 fresh human-rated blurbs per week</text>
  <text x="870" y="658" font-size="18" font-weight="700" fill="#1d1c1a" text-anchor="middle">watching the judge for drift</text>

  <path d="M 330 560 L 330 530 L 560 530 L 560 510" fill="none" stroke="#0a66c2" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <path d="M 870 560 L 870 530 L 640 530 L 640 510" fill="none" stroke="#0a66c2" stroke-width="2.5" marker-end="url(#arrBlue)"/>

  <!-- takeaway -->
  <line x1="80" y1="760" x2="1120" y2="760" stroke="#d8d5d0" stroke-width="2"/>
  <text x="600" y="822" font-size="30" font-weight="700" fill="#1d1c1a" text-anchor="middle">A judge&#8217;s reasoning is part of the pipeline,</text>
  <text x="600" y="860" font-size="30" font-weight="700" fill="#1d1c1a" text-anchor="middle">not a debug log.</text>
</svg>
